devices:
  mppt:
    description: Renogy Rover MPPT (Maximum Power Point Tracking) controller
    driver: renogy_rover
    address: /dev/ttyUSB0
    port: 1

  thermo-exterior:
    description: Exterior temperature sensor
    driver: ds18b20
    sensor_id: 28-00000

  thermo-interior:
    description: Interior temperature and humidity sensor
    driver: dht
    gpio: 17

  display:
    description: 16x2 LCD display
    driver: lcd
    address: 0x27
    gpio:
      rs: 26
      en: 19
      d4: 13
      d5: 6
      d6: 5
      d7: 11

